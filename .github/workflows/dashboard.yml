name: Build dashboard

on:
  schedule:
    # Every 30 minutes. GitHub queues cron generously on shared runners,
    # so treat this as "roughly half-hourly", not exact.
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

# Only one deploy at a time; a queued run supersedes an older pending one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      # DASHBOARD_TOKEN (a PAT with repo + security_events) enables the
      # Dependabot alert columns. Without it the build still succeeds and the
      # page says the counts are unavailable — it never fails for want of a scope.
      - name: Collect metrics
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_TOKEN || secrets.GITHUB_TOKEN }}
          DASHBOARD_OWNER: ${{ github.repository_owner }}
          WINDOW_DAYS: "90"
        run: python3 scripts/collect.py

      - name: Render page
        run: python3 scripts/render.py

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
