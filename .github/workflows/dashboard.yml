name: Build dashboard

on:
  schedule:
    # Every 10 minutes. Collection is parallelised (~7s at 13 repos), so a
    # build is cheap; the limit is the GitHub API budget, not compute.
    # 6 builds/hour x ~6 calls per repo stays well inside the 5,000/hour
    # authenticated quota -- roughly 9% at 13 repos, 36% at 50. The
    # collector refuses to build rather than emit partial data if the
    # remaining quota would not cover a full pass.
    # GitHub schedules cron best-effort on shared runners, so treat this as
    # "about every 10 minutes", not exact.
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

# Only one deploy at a time; a queued run supersedes an older pending one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # DASHBOARD_TOKEN (a PAT with repo + security_events) enables the
      # Dependabot alert columns. Without it the build still succeeds and the
      # page says the counts are unavailable — it never fails for want of a scope.
      - name: Collect metrics
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_TOKEN || secrets.GITHUB_TOKEN }}
          DASHBOARD_OWNER: ${{ github.repository_owner }}
          WINDOW_DAYS: "180"
          COLLECT_WORKERS: "8"
        run: python3 scripts/collect.py

      - name: Render page
        run: python3 scripts/render.py

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
