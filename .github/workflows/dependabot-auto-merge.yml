name: Dependabot auto-merge

# Merges Dependabot's routine updates so patch and minor bumps stop
# accumulating in the review queue.
#
# NOTE -- this repo differs from the others. Every other repo waits for a
# required status check via `gh pr merge --auto`; main here has no ruleset and
# no PR-triggered check, and GitHub refuses to queue auto-merge on a PR that
# nothing is blocking. So this merges directly on open. The only ecosystem
# watched here is github-actions, and a bad bump surfaces as a failed "Build
# dashboard" run on main rather than as a blocked PR. If main ever gains a
# required check, switch this step to `gh pr merge --auto --squash` to match
# the other repos.
#
# Majors are excluded either way: they are the updates that can require a code
# change on our side.

on: pull_request

# Workflows triggered by Dependabot get a read-only GITHUB_TOKEN by default;
# these two scopes are what allow this job to merge. Note it never checks out
# or executes the PR's code -- it only reads metadata and calls the API -- so
# the elevated scopes are not reachable from an untrusted branch.
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Read Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # For a grouped PR, update-type is the HIGHEST bump in the batch, so a
      # single major holds the whole PR back rather than riding along unseen.
      - name: Merge patch and minor updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --squash "$PR_URL"
